services:
  api:
    build:
      target: development
    environment:
      WATCHFILES_FORCE_POLLING: "true"
      PYTHONPATH: /app/src
    volumes:
      - ./backend/src:/app/src
      - ./backend/alembic:/app/alembic
    command: ["python", "-m", "uvicorn", "agentdesk.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload", "--reload-dir", "/app/src"]
