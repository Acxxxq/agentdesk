# 保留既有本地 Compose 项目标识，使旧 API 容器可原位更新并沿用当前网络与端口。
name: agentdesk

services:
  api:
    build:
      context: ./backend
      target: runtime
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-development}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-deepseek-v4-pro}
      ANTHROPIC_BASE_URL: ${ANTHROPIC_BASE_URL:-https://api.deepseek.com/anthropic}
      ANTHROPIC_TIMEOUT_SECONDS: ${ANTHROPIC_TIMEOUT_SECONDS:-45}
    ports:
      - "127.0.0.1:${API_PORT:-18000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/live', timeout=5)"]
      interval: 10s
      timeout: 6s
      retries: 10
      start_period: 10s

  tests:
    profiles: ["test"]
    build:
      context: ./backend
      target: development
    environment:
      APP_ENV: test
    command: ["sh", "-c", "python -m pytest -q && python -m ruff check ."]

  evaluator:
    profiles: ["evaluation"]
    build:
      context: ./backend
      target: development
    working_dir: /workspace
    volumes:
      - .:/workspace
    depends_on:
      api:
        condition: service_healthy
    entrypoint:
      - sh
      - -c
      - git config --global --add safe.directory /workspace && exec python -m agentorbis.evaluation.intent "$@"
      - --
